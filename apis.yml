aid: aiden-auto
name: Aiden Auto
description: 'AiDEN Auto (Aiden Automotive Inc.) is a connected-vehicle software company
  founded in 2021 by former Volvo Cars connected-services and infotainment engineers, with
  offices in San Ramon, California and Gothenburg, Sweden. Its software-only platform runs
  natively on Android Automotive OS (AAOS) infotainment head units and lets automakers,
  fleets and third-party service providers deliver in-cab mobility services — tolling,
  parking, fueling and charging, payments, insurance, roadside assistance, maintenance and
  regulatory compliance such as Poland''s SENT cross-border freight reporting — without a
  phone, a downloaded app, or a bespoke per-OEM integration. AiDEN brokers real-time vehicle
  signals (fuel level, tire pressure, battery state, engine data, location) to partner
  backends under an application-level, GDPR/CCPA-aligned consent model, and partners
  configure signal access and triggers through the AiDEN Portal rather than proprietary OEM
  APIs. The company is a COVESA member, has raised roughly $11M (a $6.1M oversubscribed seed
  announced February 2025), holds three patents covering in-vehicle consent, payments and
  data sharing, and works with Volvo Trucks, HERE Technologies and IF Insurance among others.'
